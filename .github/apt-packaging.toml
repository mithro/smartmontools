# What kind of packaging repository this is, and why it differs from the
# defaults: mithro/apt-repo-action's docs/packaging.md ("The declaration").
kind = "A"
upstream = "https://github.com/smartmontools/smartmontools"

# Upstream's history came from svn: its RELEASE_X_Y tags are on commits off
# main, where git describe can't find them. The releases are main's own
# "Release 7.5 RELEASE_7_5" commits.
[version]
release-subject = '^Release (\d+(?:\.\d+)+) RELEASE_\d+(?:_\d+)+$'
